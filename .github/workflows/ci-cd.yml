name: Lesson CI and CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lesson-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v7
      - name: Prepare Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s demo/tests -v
      - name: Build site
        run: python demo/build.py
      - name: Save site artifact
        uses: actions/upload-artifact@v7
        with:
          name: lesson-site
          path: demo/dist/
          if-no-files-found: error
          retention-days: 3
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo/dist/

  deploy:
    needs: check-build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
